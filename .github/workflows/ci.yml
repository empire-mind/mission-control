name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile check
        run: python -m py_compile mc
      - name: graceful-degrade smoke (no estate on a runner — must exit 0, never raise)
        run: ./mc status
